name: relay_server CI

# Node/TypeScript-Server unter /relay_server.
# Reihenfolge bewusst build -> test -> lint, damit Type-Fehler zuerst auffallen.

on:
  push:
    branches: [main]
    paths:
      - "relay_server/**"
      - ".github/workflows/relay_server.yml"
  pull_request:
    paths:
      - "relay_server/**"
      - ".github/workflows/relay_server.yml"

defaults:
  run:
    working-directory: relay_server

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: relay_server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
