version: "3.8"

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: photoframe-relay:latest
    container_name: photoframe-relay
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATA_DIR=/data
    volumes:
      - photoframe-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  photoframe-data:
