name: mobile_app
description: PhotoFrame companion app - manages photo sources and drives the slideshow.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management / navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking / transport
  dio: ^5.4.3
  socket_io_client: ^2.0.3
  webdav_client: ^1.2.2
  multicast_dns: ^0.3.2+6
  connectivity_plus: ^6.0.5

  # Storage / persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24

  # Media / images
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Device / platform
  wakelock_plus: ^1.2.5
  screen_brightness: ^1.0.1
  permission_handler: ^11.3.1

  # Crypto / identifiers
  crypto: ^3.0.3
  cryptography: ^2.7.0
  uuid: ^4.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.2
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
