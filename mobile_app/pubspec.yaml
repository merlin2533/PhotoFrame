name: mobile_app
description: PhotoFrame companion app - manages photo sources and drives the slideshow.
publish_to: 'none'
version: 0.1.0+13

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # State management / navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2

  # Networking / transport
  dio: ^5.4.3
  socket_io_client: ^3.1.6
  webdav_client: ^1.2.2
  multicast_dns: ^0.3.2+6
  connectivity_plus: ^7.3.1

  # Storage / persistence
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Media / images
  image_picker: ^1.1.2
  cached_network_image: ^4.0.6
  flutter_image_compress: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.3

  # Local folder source (SAF/file picker on Android, folder picker on iOS)
  file_picker: ^13.3.0
  # SMB source. UNVERIFIED CHOICE (see smb_photo_source.dart doc comment):
  # `smb_connect` is used over `samba_client` because it wraps the more
  # actively-referenced jcifs-ng client and exposes a simpler high-level API
  # in its published docs; neither package could be exercised against a real
  # share in this environment (no device, no SMB spike hardware - see
  # docs/PLAN.md M1). Treat this dependency as provisional pending the M1
  # spike.
  smb_connect: ^0.0.9

  # Device / platform
  wakelock_plus: ^1.2.5
  screen_brightness: ^2.1.11
  permission_handler: ^13.0.2
  # Optional convenience for the weather overlay's "aktuellen Standort
  # verwenden" button; manual city entry (default) does not need this.
  geolocator: ^14.1.2

  # Crypto / identifiers
  crypto: ^3.0.3
  cryptography: ^2.7.0
  uuid: ^4.4.0

  cupertino_icons: ^2.0.0

  # App version display (settings screen) - reads pubspec.yaml's `version:`
  # at build time, no manual wiring needed when it's bumped.
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.2
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  # Previously only a transitive dependency (pulled in indirectly); made
  # explicit now that slideshow_engine_test.dart imports it directly to
  # deterministically advance SlideshowEngine's Timer.periodic without real
  # wall-clock delays.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  generate: true
